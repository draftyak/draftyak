# cargo-deny 0.20.2 policy for the crates/ workspace; `pnpm verify` and CI run `cargo-deny --locked check`.

# Every RustSec advisory fails the check, for any crate in the graph, as does a yanked version.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

# Exactly the licences the locked crates resolve to, dev-dependencies included. A new crate's
# licence is one more line here, listed in its PR for the owner.
[licenses]
include-dev = true
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    # unicode-ident, through serde's and thiserror's derive macros.
    "Unicode-3.0",
]
# ISC is approved only for these exact TLS dependencies, never for another crate or version.
exceptions = [
    { name = "ring", version = "=0.17.14", allow = ["Apache-2.0", "ISC"] },
    { name = "untrusted", version = "=0.9.0", allow = ["ISC"] },
    { name = "rustls-webpki", version = "=0.103.15", allow = ["ISC"] },
]

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
skip = [
    { name = "getrandom", version = "=0.2.17", reason = "ring 0.17.14 requires getrandom 0.2; rand 0.10.3 requires getrandom 0.4.3" },
    { name = "windows-sys", version = "=0.52.0", reason = "ring 0.17.14 requires windows-sys 0.52; tokio, mio and socket2 require 0.61.2" },
]
deny = [
    { name = "reqwest" },
    { name = "native-tls" },
    { name = "tokio-native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    { name = "rustls-native-certs" },
    { name = "webpki-roots" },
    { name = "rustls-platform-verifier" },
    { name = "webpki-root-certs" },
]

# crates.io only.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
