[package]
name = "draftyak-protocol"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
base64ct = { version = "=1.8.3", features = ["alloc"] }
# Pins the RustCrypto generation p256 signs with (M0.32's set); the code reaches it through p256.
ecdsa = { version = "=0.17.0", default-features = false }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_json_canonicalizer = "=0.4.1"
sha2 = { version = "=0.11.1", default-features = false }
thiserror = "=2.0.21"
unicode-normalization = "=0.1.25"

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
