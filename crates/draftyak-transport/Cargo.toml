[package]
name = "draftyak-transport"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
draftyak-protocol = { path = "../draftyak-protocol" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
hkdf = { version = "=0.13.0", default-features = false }
http-body-util = "=0.1.3"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "net", "io-util", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
zeroize = "=1.9.1"

[dev-dependencies]
jiff = { version = "=0.2.38", features = ["tzdb-bundle-always"] }
jiff-tzdb = "=0.1.9"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "net", "io-util", "time", "macros"] }
