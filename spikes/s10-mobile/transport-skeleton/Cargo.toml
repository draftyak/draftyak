[package]
name = "transport-skeleton"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ring"]
ring = ["dep:ring", "rustls/ring", "tokio-rustls/ring", "rcgen/ring"]
aws-lc-rs = ["dep:aws-lc-rs", "rustls/aws_lc_rs", "tokio-rustls/aws_lc_rs", "rcgen/aws_lc_rs"]
# keyring-core's in-memory store on desktop targets; only the tests turn it on (below).
mock-store = []

[dependencies]
aws-lc-rs = { version = "=1.18.2", optional = true, default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
ecdsa = { version = "=0.17.0" }
hmac = "=0.13.0"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
jiff = { version = "=0.2.38", features = ["tzdb-bundle-always"] }
jiff-tzdb = "=0.1.9"
keyring-core = "=1.0.1"
p256 = { version = "=0.14.0" }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem"] }
ring = { version = "=0.17.14", optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "logging"] }
serde = "=1.0.229"
serde_json = "=1.0.154"
serde_json_canonicalizer = "=0.4.1"
sha2 = "=0.11.1"
tokio = { version = "=1.53.3", features = ["rt", "net", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["logging"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
transport-skeleton = { path = ".", default-features = false, features = ["mock-store"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["protected"] }
