[package]
name = "draftyak-spike-desktop"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"

# Without the default `app` feature only the supervisor builds, with no Tauri and none of its
# system libraries, so its tests also run on CI's plain Linux runners.
[features]
default = ["app"]
app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-autostart"]

[[bin]]
name = "draftyak-spike-desktop"
path = "src/main.rs"
required-features = ["app"]

[build-dependencies]
tauri-build = { version = "=2.7.3", optional = true }

[dependencies]
getrandom = "=0.3.4"
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", optional = true, features = ["tray-icon"] }
tauri-plugin-autostart = { version = "=2.7.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

# Keep-awake and resume (src/power.rs) use the versions tauri's and keyring's trees already lock.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSNotification",
  "NSOperation",
  "NSString",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# No debug info for dependencies: faster builds on the shared dev box.
[profile.dev.package."*"]
debug = false

[workspace]
