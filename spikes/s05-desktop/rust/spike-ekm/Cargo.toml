[package]
name = "spike-ekm"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ring"]
ring = ["dep:ring", "rustls/ring", "tokio-rustls/ring"]
# The trial build: --no-default-features --features aws-lc-rs, so ring is left out entirely.
aws-lc-rs = ["dep:aws-lc-rs", "rustls/aws_lc_rs", "tokio-rustls/aws_lc_rs"]

[dependencies]
aws-lc-rs = { version = "=1.18.2", optional = true }
ring = { version = "=0.17.14", optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
tokio = { version = "=1.53.3", features = ["io-util", "net", "rt", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false }

[lints]
workspace = true
