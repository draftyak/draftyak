[package]
name = "spike-keyring"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Its default `v1` feature picks the platform store; the store crates are pinned below.
keyring = "=4.2.0"
keyring-core = "=1.0.1"
ring = "=0.17.14"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
# The store's own version, for turning keychain prompts off and reading their OS codes.
security-framework = "=3.7.0"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[lints]
workspace = true
