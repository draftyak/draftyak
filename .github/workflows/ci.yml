name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: '1'
  TURBO_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.areas.outputs.areas }}
      docs-only: ${{ steps.areas.outputs.docs-only }}
      rust: ${{ steps.areas.outputs.rust }}
      spikes: ${{ steps.areas.outputs.spikes }}
      heavy: ''
      template-smoke: 'false'
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci-checks/src/changes.ts

  cheap:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - name: Docs-only checks, without an install
        if: needs.changes.outputs.docs-only == 'true'
        run: node tools/verify/verify.ts --profile docs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.docs-only != 'true'
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.docs-only != 'true'
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/**', '**/*.ts', '**/*.json', '!**/node_modules/**') }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - if: needs.changes.outputs.docs-only != 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.docs-only != 'true'
        run: pnpm verify --profile cheap

  full:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
    if: needs.changes.outputs.docs-only != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/**', '**/*.ts', '**/*.json', '!**/node_modules/**') }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        if: needs.changes.outputs.rust != ''
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.rust != ''
        with:
          workspaces: ${{ needs.changes.outputs.rust }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: test:heavy for the touched spikes
        if: needs.changes.outputs.spikes != ''
        env:
          SPIKES: ${{ needs.changes.outputs.spikes }}
        run: |
          filters=()
          for dir in $SPIKES; do filters+=("--filter=./$dir"); done
          node tools/verify/turbo.ts run test:heavy "${filters[@]}"

  windows:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
    if: needs.changes.outputs.docs-only != 'true' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/**', '**/*.ts', '**/*.json', '!**/node_modules/**') }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      # Warm the hosted runner's engine before parallel test capability probes.
      - name: Initialize the Windows container service
        shell: pwsh
        timeout-minutes: 2
        run: |
          Start-Service -Name docker -ErrorAction Stop
          (Get-Service -Name docker).WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
          $dockerOs = docker version --format '{{.Server.Os}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($dockerOs -notin @('windows', 'linux')) { throw 'Docker engine did not report its platform' }
          Write-Output "Docker engine platform: $dockerOs"
      - run: pnpm verify
        env:
          # Package suites each start their own test workers on this runner.
          TURBO_CONCURRENCY: '1'

  required:
    # The merge rule requires `required`, so a draft run's cheap-only result reports under another name.
    name: ${{ github.event.pull_request.draft && 'required (draft)' || 'required' }}
    needs: [changes, cheap, full, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Write verification receipt and enforce required jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_PR_DRAFT: ${{ github.event.pull_request.draft == true }}
        run: node tools/ci-checks/src/verification-receipt.ts report
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-verification.json
          if-no-files-found: error
          retention-days: 7
