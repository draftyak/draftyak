name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: '1'
  TURBO_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

# Every job runs the reserved gate on its own checkout before any repository code, and the
# pre-install check right before pnpm sets up or installs anything.
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.areas.outputs.areas }}
      docs-only: ${{ steps.areas.outputs.docs-only }}
      rust: ${{ steps.areas.outputs.rust }}
      spikes: ${{ steps.areas.outputs.spikes }}
      spike-matrix: ${{ steps.shards.outputs.matrix }}
      spike-count: ${{ steps.shards.outputs.count }}
      heavy: ${{ steps.areas.outputs.heavy }}
      native-transport: ${{ steps.native.outputs.native-transport }}
      ordinary-heavy: ${{ steps.native.outputs.ordinary-heavy }}
      template-smoke: ${{ steps.areas.outputs.template-smoke || 'false' }}
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reserved paths and execution inputs
        run: node tools/verify/gate.ts
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci-checks/src/changes.ts
      - id: native
        env:
          HEAVY: ${{ steps.areas.outputs.heavy }}
          RUST: ${{ steps.areas.outputs.rust }}
        run: node tools/ci-checks/src/native-transport.ts select
      - id: shards
        env:
          SPIKES: ${{ steps.areas.outputs.spikes }}
        run: node tools/ci-checks/src/heavy-shards.ts plan

  cheap:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reserved paths and execution inputs
        run: node tools/verify/gate.ts
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - name: Docs-only checks, without an install
        if: needs.changes.outputs.docs-only == 'true'
        run: node tools/verify/verify.ts --profile docs
      - name: Pre-install script check
        if: needs.changes.outputs.docs-only != 'true'
        run: node tools/verify/preinstall.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.docs-only != 'true'
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.docs-only != 'true'
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/**', '**/*.ts', '**/*.json', '!**/node_modules/**') }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - if: needs.changes.outputs.docs-only != 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.docs-only != 'true'
        run: pnpm verify --profile cheap

  full:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
      native-transport: ${{ steps.native.outputs.native-transport }}
    if: needs.changes.outputs.docs-only != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reserved paths and execution inputs
        run: node tools/verify/gate.ts
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - name: Require the selected native platform
        if: needs.changes.outputs.native-transport == 'true'
        env:
          NATIVE_PLATFORM: linux
          NATIVE_ARCHITECTURE: x64
        run: node tools/ci-checks/src/native-transport.ts platform
      - name: Pre-install script check
        run: node tools/verify/preinstall.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/**', '**/*.ts', '**/*.json', '!**/node_modules/**') }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        if: needs.changes.outputs.rust != ''
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.rust != ''
        with:
          workspaces: ${{ needs.changes.outputs.rust }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run native transport checks
        id: native
        if: needs.changes.outputs.native-transport == 'true'
        env:
          NATIVE_PLATFORM: linux
          NATIVE_ARCHITECTURE: x64
        run: pnpm exec node tools/ci-checks/src/native-transport.ts run

  spike-run:
    name: Spike heavy (${{ matrix.id }})
    needs: changes
    if: needs.changes.outputs.docs-only != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.spike-count != '0'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.changes.outputs.spike-matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRAFTYAK_STRICT_SKIPS: '1'
      SHARD_ID: ${{ matrix.id }}
      SPIKE: ${{ matrix.spike }}
      SPIKES: ${{ needs.changes.outputs.spikes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reserved paths and execution inputs
        run: node tools/verify/gate.ts
      - run: node tools/ci-checks/src/heavy-shards.ts validate
      - name: Pre-install script check
        run: node tools/verify/preinstall.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.id }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/**', '**/*.ts', '**/*.json', '!**/node_modules/**') }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-${{ matrix.id }}-
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        if: needs.changes.outputs.rust != ''
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.rust != ''
        with:
          workspaces: ${{ needs.changes.outputs.rust }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare authenticated offline Node fixture
        id: offline-node
        if: needs.changes.outputs.spikes != '' || needs.changes.outputs.ordinary-heavy != ''
        env:
          DRAFTYAK_CACHE_DIR: ${{ runner.temp }}/draftyak-node-input
        run: |
          pnpm fetch-node --version bundled --platform linux --arch x64
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const { bundled } = JSON.parse(readFileSync('tools/fetch-node/versions.json', 'utf8'));
          const cache = path.join(process.env.DRAFTYAK_CACHE_DIR, 'node', bundled);
          appendFileSync(process.env.GITHUB_OUTPUT, `cache=${cache}\n`);
          NODE
      - name: Plan browser prerequisites
        id: browser-setup
        env:
          SPIKES: ${{ matrix.spike }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/draftyak-playwright
        run: node tools/ci-checks/src/browser-setup.ts plan
      - name: Cache Playwright browsers
        id: browser-cache
        if: steps.browser-setup.outputs.required == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-setup.outputs.path }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser prerequisites
        if: steps.browser-setup.outputs.required == 'true'
        env:
          SPIKES: ${{ matrix.spike }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ steps.browser-setup.outputs.path }}
        run: node tools/ci-checks/src/browser-setup.ts install
      # The reserved heavy suites of the shard's spike, opted in and uncached, with the proof from
      # their counts that they ran. They run before the shard's ordinary heavy suites, which leave
      # reserved packages out, since a heavy suite may stage files that listed files name, and every
      # gated entry after it would refuse those.
      - name: Opt-in heavy suites in the touched spikes
        env:
          DRAFTYAK_RESERVED_TESTS: '1'
        run: |
          node tools/verify/reserved-proof.ts --tier heavy "--filter=./$SPIKE"
      - name: test:heavy for the touched spikes
        id: heavy-test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ steps.browser-setup.outputs.path }}
          DRAFTYAK_TEST_NODE_CACHE: ${{ steps.offline-node.outputs.cache }}
          DRAFTYAK_CACHE_DIR: ${{ runner.temp }}/draftyak-node-scratch
        run: |
          node tools/verify/turbo.ts run test:heavy --concurrency=1 --log-order=stream --log-prefix=task "--filter=./$SPIKE"
      - id: receipt
        env:
          SHARD_COMMAND_RESULT: ${{ steps.heavy-test.outcome }}
        run: node tools/ci-checks/src/heavy-shards.ts receipt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-spike-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: ${{ steps.receipt.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  spikes:
    needs: [changes, spike-run]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.docs-only != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.spike-count != '0'
    outputs:
      source: ${{ steps.source.outputs.source }}
      completed: ${{ steps.collect.outputs.completed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reserved paths and execution inputs
        run: node tools/verify/gate.ts
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.spike-run.result }}
        run: node --input-type=module -e 'if (process.env.SHARD_RESULT !== "success") process.exit(1)'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ci-spike-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/spike-receipts
          merge-multiple: true
      - id: collect
        env:
          SPIKES: ${{ needs.changes.outputs.spikes }}
          SHARD_RECEIPTS: ${{ runner.temp }}/spike-receipts
        run: node tools/ci-checks/src/heavy-shards.ts collect

  heavy:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
      completed: ${{ steps.complete.outputs.completed }}
    if: needs.changes.outputs.docs-only != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.ordinary-heavy != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRAFTYAK_STRICT_SKIPS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reserved paths and execution inputs
        run: node tools/verify/gate.ts
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - name: Pre-install script check
        run: node tools/verify/preinstall.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/**', '**/*.ts', '**/*.json', '!**/node_modules/**') }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        if: needs.changes.outputs.rust != ''
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.rust != ''
        with:
          workspaces: ${{ needs.changes.outputs.rust }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare authenticated offline Node fixture
        id: offline-node
        env:
          DRAFTYAK_CACHE_DIR: ${{ runner.temp }}/draftyak-node-input
        run: |
          pnpm fetch-node --version bundled --platform linux --arch x64
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const { bundled } = JSON.parse(readFileSync('tools/fetch-node/versions.json', 'utf8'));
          const cache = path.join(process.env.DRAFTYAK_CACHE_DIR, 'node', bundled);
          appendFileSync(process.env.GITHUB_OUTPUT, `cache=${cache}\n`);
          NODE
      - name: Plan browser prerequisites
        id: browser-setup
        env:
          SPIKES: ${{ needs.changes.outputs.spikes }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/draftyak-playwright
        run: node tools/ci-checks/src/browser-setup.ts plan
      - name: Cache Playwright browsers
        id: browser-cache
        if: steps.browser-setup.outputs.required == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-setup.outputs.path }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser prerequisites
        if: steps.browser-setup.outputs.required == 'true'
        env:
          SPIKES: ${{ needs.changes.outputs.spikes }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ steps.browser-setup.outputs.path }}
        run: node tools/ci-checks/src/browser-setup.ts install
      - name: test:heavy for ordinary product suites
        id: heavy-test
        env:
          HEAVY: ${{ needs.changes.outputs.ordinary-heavy }}
          SMOKE: ${{ needs.changes.outputs.template-smoke == 'true' || github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ steps.browser-setup.outputs.path }}
          DRAFTYAK_TEST_NODE_CACHE: ${{ steps.offline-node.outputs.cache }}
          DRAFTYAK_CACHE_DIR: ${{ runner.temp }}/draftyak-node-scratch
        run: |
          filters=()
          while IFS= read -r filter; do filters+=("--filter=$filter"); done <<< "$HEAVY"
          if [ "$SMOKE" != true ] && [ -f packages/create-plugin/package.json ]; then
            filters+=("--filter=!./packages/create-plugin")
          fi
          node tools/verify/turbo.ts run test:heavy --concurrency=1 --log-order=stream --log-prefix=task "${filters[@]}"
      - id: complete
        env:
          HEAVY: ${{ needs.changes.outputs.ordinary-heavy }}
          HEAVY_COMMAND_RESULT: ${{ steps.heavy-test.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          if (process.env.HEAVY_COMMAND_RESULT !== 'success') process.exit(1);
          appendFileSync(process.env.GITHUB_OUTPUT, `completed=${JSON.stringify(process.env.HEAVY.split('\n'))}\n`);
          NODE

  windows:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
      native-transport: ${{ steps.native.outputs.native-transport }}
    if: needs.changes.outputs.docs-only != 'true' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name != 'pull_request' && needs.changes.outputs.native-transport == 'true'))
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reserved paths and execution inputs
        run: node tools/verify/gate.ts
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - name: Require the selected native platform
        if: needs.changes.outputs.native-transport == 'true'
        env:
          NATIVE_PLATFORM: win32
          NATIVE_ARCHITECTURE: x64
        run: node tools/ci-checks/src/native-transport.ts platform
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        if: needs.changes.outputs.native-transport == 'true'
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.native-transport == 'true'
        with:
          workspaces: crates
      - name: Pre-install script check
        run: node tools/verify/preinstall.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/**', '**/*.ts', '**/*.json', '!**/node_modules/**') }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      # Warm the hosted runner's engine before parallel test capability probes.
      - name: Initialize the Windows container service
        shell: pwsh
        timeout-minutes: 2
        run: |
          Start-Service -Name docker -ErrorAction Stop
          (Get-Service -Name docker).WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
          $dockerOs = docker version --format '{{.Server.Os}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($dockerOs -notin @('windows', 'linux')) { throw 'Docker engine did not report its platform' }
          Write-Output "Docker engine platform: $dockerOs"
      - run: pnpm verify
        env:
          # Package suites each start their own test workers on this runner.
          TURBO_CONCURRENCY: '1'
      - name: Run native transport checks
        id: native
        if: needs.changes.outputs.native-transport == 'true'
        env:
          NATIVE_PLATFORM: win32
          NATIVE_ARCHITECTURE: x64
        run: pnpm exec node tools/ci-checks/src/native-transport.ts run

  macos:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
      native-transport: ${{ steps.native.outputs.native-transport }}
    if: needs.changes.outputs.docs-only != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.native-transport == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reserved paths and execution inputs
        run: node tools/verify/gate.ts
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - name: Require the selected native platform
        env:
          NATIVE_PLATFORM: darwin
          NATIVE_ARCHITECTURE: arm64
        run: node tools/ci-checks/src/native-transport.ts platform
      - name: Pre-install script check
        run: node tools/verify/preinstall.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates
      - run: pnpm install --frozen-lockfile
      - name: Run native transport checks
        id: native
        env:
          NATIVE_PLATFORM: darwin
          NATIVE_ARCHITECTURE: arm64
        run: pnpm exec node tools/ci-checks/src/native-transport.ts run

  # The reserved unit suites run opted in here, in a log of their own, and the proof checks from
  # their counts that they ran; the inventory check keeps their maintainer's minimums from dropping.
  reserved:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reserved paths and execution inputs
        run: node tools/verify/gate.ts
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - name: Reserved-test inventory against the base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node tools/ci-checks/src/reserved-inventory.ts
      - name: Pre-install script check
        run: node tools/verify/preinstall.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Opt-in reserved unit suites and their execution proof
        env:
          DRAFTYAK_RESERVED_TESTS: '1'
        run: node tools/verify/reserved-proof.ts --tier unit

  # The same opted-in unit proof on Windows, wherever the windows job runs, since that job's
  # pnpm verify leaves the reserved suites out.
  reserved-windows:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
    if: needs.changes.outputs.docs-only != 'true' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name != 'pull_request' && needs.changes.outputs.native-transport == 'true'))
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reserved paths and execution inputs
        run: node tools/verify/gate.ts
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - name: Pre-install script check
        run: node tools/verify/preinstall.ts
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # As in the windows job: the kit's capability probes ask the engine for its platform.
      - name: Initialize the Windows container service
        shell: pwsh
        timeout-minutes: 2
        run: |
          Start-Service -Name docker -ErrorAction Stop
          (Get-Service -Name docker).WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
          $dockerOs = docker version --format '{{.Server.Os}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($dockerOs -notin @('windows', 'linux')) { throw 'Docker engine did not report its platform' }
          Write-Output "Docker engine platform: $dockerOs"
      - name: Opt-in reserved unit suites and their execution proof
        env:
          DRAFTYAK_RESERVED_TESTS: '1'
        run: node tools/verify/reserved-proof.ts --tier unit

  required:
    # The merge rule requires `required`, so a draft run's cheap-only result reports under another name.
    name: ${{ github.event.pull_request.draft && 'required (draft)' || 'required' }}
    needs: [changes, cheap, full, spikes, heavy, windows, macos, reserved, reserved-windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # This job runs even after another job's gate refused the tree, so it checks first too.
      - name: Reserved paths and execution inputs
        run: node tools/verify/gate.ts
      - name: Write verification receipt and enforce required jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_PR_DRAFT: ${{ github.event.pull_request.draft == true }}
        run: node tools/ci-checks/src/verification-receipt.ts report
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-verification.json
          if-no-files-found: error
          retention-days: 7
