name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: '1'
  TURBO_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.areas.outputs.areas }}
      docs-only: ${{ steps.areas.outputs.docs-only }}
      rust: ${{ steps.areas.outputs.rust }}
      spikes: ${{ steps.areas.outputs.spikes }}
      heavy: ${{ steps.areas.outputs.heavy }}
      template-smoke: ${{ steps.areas.outputs.template-smoke }}
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci-checks/src/changes.ts

  cheap:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - name: Docs-only checks, without an install
        if: needs.changes.outputs.docs-only == 'true'
        run: node tools/verify/verify.ts --profile docs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.docs-only != 'true'
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.docs-only != 'true'
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/**', '**/*.ts', '**/*.json', '!**/node_modules/**') }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - if: needs.changes.outputs.docs-only != 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.docs-only != 'true'
        run: pnpm verify --profile cheap

  full:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
    if: needs.changes.outputs.docs-only != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/**', '**/*.ts', '**/*.json', '!**/node_modules/**') }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        if: needs.changes.outputs.rust != ''
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.rust != ''
        with:
          workspaces: ${{ needs.changes.outputs.rust }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Also on workflow changes, so an edit to the pin or the download is tested on its own PR.
      - name: cargo-deny 0.20.2, checked against its published SHA-256
        if: contains(fromJSON(needs.changes.outputs.areas), 'rust:crates') || contains(fromJSON(needs.changes.outputs.areas), 'workflows')
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          dir="$RUNNER_TEMP/cargo-deny"
          mkdir -p "$dir"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 --output "$dir/$name.tar.gz" "$url"
          echo "$DENY_SHA256  $dir/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/$name.tar.gz" -C "$dir" --strip-components=1 "$name/cargo-deny"
          "$dir/cargo-deny" --version
      - name: Rust checks for crates/ (fmt, cargo-deny, clippy, tests)
        if: contains(fromJSON(needs.changes.outputs.areas), 'rust:crates')
        run: DRAFTYAK_CARGO_DENY="$RUNNER_TEMP/cargo-deny/cargo-deny" node tools/verify/verify.ts --profile rust
      - name: test:heavy for the touched spikes and the selected packages
        if: needs.changes.outputs.spikes != '' || needs.changes.outputs.heavy != ''
        env:
          SPIKES: ${{ needs.changes.outputs.spikes }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          SMOKE: ${{ needs.changes.outputs.template-smoke == 'true' || github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        run: |
          filters=()
          for dir in $SPIKES; do filters+=("--filter=./$dir"); done
          while IFS= read -r filter; do
            if [ -n "$filter" ]; then filters+=("--filter=$filter"); fi
          done <<< "$HEAVY"
          # The template smoke packs and installs, so it runs only for its own packages and global
          # changes, on main and on PRs into main.
          if [ "$SMOKE" != true ] && [ -f packages/create-plugin/package.json ]; then
            filters+=("--filter=!./packages/create-plugin")
          fi
          node tools/verify/turbo.ts run test:heavy "${filters[@]}"

  windows:
    needs: changes
    outputs:
      source: ${{ steps.source.outputs.source }}
    if: needs.changes.outputs.docs-only != 'true' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: source
        run: node tools/ci-checks/src/verification-receipt.ts capture
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/**', '**/*.ts', '**/*.json', '!**/node_modules/**') }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        if: hashFiles('crates/Cargo.toml') != ''
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  required:
    needs: [changes, cheap, full, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Write verification receipt and enforce required jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_PR_DRAFT: ${{ github.event.pull_request.draft == true }}
        run: node tools/ci-checks/src/verification-receipt.ts report
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-verification.json
          if-no-files-found: error
          retention-days: 7
