name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: '1'
  TURBO_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: e2e-linux-chromium-webkit
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/draftyak-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium and WebKit prerequisites
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/draftyak-playwright
        run: node apps/web/e2e/install.ts chromium webkit
      - name: Test Chromium and WebKit
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/draftyak-playwright
        run: pnpm --filter @draftyak/web test:e2e -- --project=chromium --project=webkit

  macos:
    name: e2e-macos-webkit
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/draftyak-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install WebKit prerequisites
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/draftyak-playwright
        run: node apps/web/e2e/install.ts webkit
      - name: Test WebKit
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/draftyak-playwright
        run: pnpm --filter @draftyak/web test:e2e -- --project=webkit

  windows:
    name: e2e-windows-chromium
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/draftyak-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium prerequisites
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/draftyak-playwright
        run: node apps/web/e2e/install.ts chromium
      - name: Test Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/draftyak-playwright
        run: pnpm --filter @draftyak/web test:e2e -- --project=chromium
