name: Bug report
description: Report a reproducible problem with DraftYak.
title: "bug: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        For security concerns, use [private reporting](https://github.com/draftyak/draftyak/security/advisories/new).
        Use synthetic examples. Public issues must not contain messages, credentials or other people's information.
  - type: checkboxes
    id: privacy
    attributes:
      label: No message content
      options:
        - label: This report and its attachments contain no real message content, tokens, credentials, addresses, phone numbers or other people's private information.
          required: true
  - type: input
    id: version
    attributes:
      label: DraftYak version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS and version, install method, component and relevant plugin versions. Omit account identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest reproduction using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include only content-free diagnostics you have reviewed for private data.
    validations:
      required: true
